# Sized for this machine, not for the Flutter template's default of -Xmx8G
# with a 4G metaspace. That default asks for more heap than the box has
# physical memory, and the daemon does not fail cleanly when it cannot get
# it: Gradle reports the paging as filesystem faults, which read like a
# corrupt cache rather than a memory problem --
#
#   java.io.IOException: Couldn't create directory: ...\transforms\<hash>
#   Source directory '...\gradle\src\main\kotlin' is not a directory.
#
# both for directories that exist and are writable. Raise these only after
# checking total RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError

# One worker, and the Kotlin compiler inside the Gradle daemon rather than a
# JVM of its own. On a 7 GB machine the default (one worker per core, plus a
# separate Kotlin daemon) exhausts the Windows paged pool and tasks fail with
#
#   java.nio.file.FileSystemException: ...core-lambda-stubs.jar:
#   Insufficient system resources exist to complete the requested service
#
# which is Windows error 1450, not anything wrong with the code. Builds are
# slower this way and they finish.
org.gradle.workers.max=1
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
# Jetifier rewrites support-library references in dependencies. Nothing in
# this dependency set still needs it, and AGP 9 errors on an unused run.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

kotlin.incremental=false
